name: plan2sim-backend
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_dev_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plan2sim}
      MYSQL_USER: ${MYSQL_USER:-plan2sim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_change_me}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:3307:3306" # for local MySQL clients; use 3306 inside Docker network
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    environment: &backend_env
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-plan2sim}:${MYSQL_PASSWORD:-dev_change_me}@mysql:3306/${MYSQL_DATABASE:-plan2sim}?charset=utf8mb4"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    environment: *backend_env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  digirunner:
    image: tpisoftwareopensource/digirunner-open-source
    profiles: ["gateway"]
    environment:
      TZ: Asia/Taipei
    ports:
      - "127.0.0.1:31080:18080"
    # Gateway is NOT auto-configured. Register API proxy in digiRunner UI.
volumes:
  mysql_data:
